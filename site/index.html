<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ursift — a search engine to your liking</title>
<meta name="description" content="Type a question. ursift brings back text-only links about it, from the news.">
<meta name="theme-color" content="#0e1116">
<link rel="stylesheet" href="assets/css/app.css">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
</head>
<body>

<header class="top">
  <div class="top__row">
    <h1 class="brand">ursift</h1>
    <p class="brand__tag">a search engine to your liking</p>
  </div>

  <form class="search" id="sift-form" role="search">
    <input class="search__input" id="sift-input" type="search" name="q" autocomplete="off"
           autocapitalize="off" spellcheck="false" aria-label="What do you want to sift?"
           placeholder="a question, a topic, anything at all">
    <button class="btn btn--primary" type="submit">Sift</button>
  </form>

  <p class="status" id="status" role="status" aria-live="polite"></p>
</header>

<main class="main" id="results"></main>

<footer class="foot">
  <p>Text only. No images, no video, no account. Nothing is fetched until you press Sift.</p>
</footer>

<script src="assets/js/api.js"></script>
<script src="assets/js/app.js"></script>
</body>
</html>
