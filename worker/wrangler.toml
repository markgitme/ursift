name = "ursift"
main = "worker.js"
compatibility_date = "2026-01-01"

# The static site is served from the same deployment as the API. `directory`
# is resolved relative to THIS file, so ../build is the repo's build folder.
# Run ./build.sh from the repo root first.
[assets]
directory = "../build"
binding = "ASSETS"

# The Worker serves /api/* and falls through to the static site for everything
# else, from the assets binding above. One deployment, one URL.
#
# Deploy from the repo root with:
#   ./build.sh && npx wrangler deploy --config worker/wrangler.toml
